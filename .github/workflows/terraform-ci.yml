name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-east-1"

jobs:
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  plan:
    name: Plan (pull requests only)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -var-file=terraform.tfvars -no-color
        # Plan output is posted as a PR comment in a full implementation
        # (e.g. via a plan-comment action) so reviewers can see proposed changes

  apply:
    name: Apply (main branch, manual approval)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production  # requires manual approval via GitHub Environments
    strategy:
      matrix:
        environment: [dev, staging, production]
      max-parallel: 1 # promote sequentially: dev -> staging -> production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform apply
        working-directory: environments/${{ matrix.environment }}
        run: terraform apply -var-file=terraform.tfvars -auto-approve
